name: Build Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công bất kỳ lúc nào

jobs:
  build:
    name: Build PassLock APK
    runs-on: ubuntu-latest

    steps:
      # 1. Kéo mã nguồn về máy ảo
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Cài đặt Java JDK 17 (Đã bỏ cache: 'gradle' để không bị lỗi No file matched)
      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Cài đặt Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Tự động sinh thư mục android/ nếu repo chỉ có mỗi lib/main.dart
      - name: Ensure Android Structure Exists
        run: |
          if [ ! -d "android" ]; then
            echo "⚡ Chưa có thư mục android/, tự động tạo môi trường Android chuẩn..."
            flutter create . --platforms=android --org=com.example
          fi

      # 5. Cấp quyền thực thi cho gradlew (tránh lỗi Permission Denied)
      - name: Grant execute permission for gradlew
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      # 6. Tự động cấu hình minSdkVersion 23 (Bắt buộc cho flutter_secure_storage)
      - name: Configure Android minSdkVersion 23
        run: |
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle || true
            sed -i 's/minSdkVersion [0-9]\+/minSdkVersion 23/g' android/app/build.gradle || true
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle.kts || true
            sed -i 's/minSdk = [0-9]\+/minSdk = 23/g' android/app/build.gradle.kts || true
          fi

      # 7. Tải dependencies
      - name: Install Dependencies
        run: flutter pub get

      # 8. Build file APK Release hoàn chỉnh
      - name: Build Android Release APK
        run: flutter build apk --release

      # 9. Đẩy file APK lên Artifacts để tải về điện thoại
      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassLock-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
