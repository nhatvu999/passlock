name: Build Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub

jobs:
  build:
    name: Build PassLock APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout mã nguồn
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Cài đặt Java JDK 17
      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Cài đặt Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Tự động tạo thư mục android nếu repo chỉ có lib/main.dart
      - name: Initialize Android Project
        run: |
          if [ ! -d "android" ]; then
            echo "⚡ Khởi tạo cấu trúc Android..."
            flutter create . --platforms=android --org=com.example
          fi

      # 5. Tự động gỡ bỏ file_picker và chuẩn hóa thư viện cần thiết
      - name: Configure Clean Dependencies
        run: |
          if [ -f "pubspec.yaml" ]; then
            sed -i '/file_picker/d' pubspec.yaml || true
          fi
          flutter pub remove file_picker 2>/dev/null || true
          flutter pub add flutter_secure_storage:^9.2.2 share_plus:^10.1.2 path_provider:^2.1.5 cupertino_icons:^1.0.8 uuid:^4.4.0
          flutter pub get

      # 6. Cấp quyền thực thi cho Gradle
      - name: Grant execute permission for gradlew
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      # 7. Ép compileSdk 36 & minSdk 23 cho toàn bộ app và các plugin phụ thuộc
      - name: Force compileSdk 36 across all Gradle modules
        run: |
          # Ép tất cả thư viện con (subprojects) trong android/build.gradle dùng API 36
          if [ -f "android/build.gradle" ]; then
            cat << 'EOF' >> android/build.gradle

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileSdkVersion 36
            }
        }
    }
}
EOF
          fi

          # Nâng SDK trong android/app/build.gradle
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle || true
            sed -i 's/compileSdkVersion [0-9]\+/compileSdkVersion 36/g' android/app/build.gradle || true
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle || true
            sed -i 's/minSdkVersion [0-9]\+/minSdkVersion 23/g' android/app/build.gradle || true
          fi

          # Hỗ trợ định dạng build.gradle.kts (Kotlin DSL)
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts || true
            sed -i 's/compileSdk = [0-9]\+/compileSdk = 36/g' android/app/build.gradle.kts || true
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle.kts || true
            sed -i 's/minSdk = [0-9]\+/minSdk = 23/g' android/app/build.gradle.kts || true
          fi

          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties

      # 8. Build file APK Release hoàn chỉnh
      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      # 9. Tải file APK lên Artifacts để tải về điện thoại
      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassLock-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
