name: Build Android APK

on:
  workflow_dispatch: # Cho phép bấm nút chạy thủ công bất kỳ lúc nào

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize Android Skeleton if missing
        run: |
          # Tự động tạo thư mục android chuẩn nếu project chỉ có file main.dart
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org=com.example
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: build/app/outputs/flutter-apk/*.apk
