name: Build Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build PassLock APK
    runs-on: ubuntu-latest

    steps:
      # 1. Tải mã nguồn về máy ảo
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Cài đặt Java JDK 17
      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Cài đặt Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Tự động khởi tạo môi trường Android nếu repo chỉ có lib/main.dart
      - name: Initialize Android Project
        run: |
          if [ ! -d "android" ]; then
            echo "⚡ Khởi tạo cấu trúc Android..."
            flutter create . --platforms=android --org=com.example
          fi

      # 5. Cài đặt các thư viện cần thiết
      - name: Add Required Dependencies
        run: |
          flutter pub add flutter_secure_storage:^9.2.2 share_plus:^10.1.2 file_picker:^8.1.6 path_provider:^2.1.5 cupertino_icons:^1.0.8 uuid:^4.4.0
          flutter pub get

      # 6. Cấp quyền thực thi cho gradlew
      - name: Grant execute permission for gradlew
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      # 7. Cấu hình compileSdk 36, minSdk 23 và đồng bộ toàn bộ plugin (Sửa lỗi :file_picker compiled against 34)
      - name: Configure Android SDK versions and Plugins
        run: |
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle || true
            sed -i 's/compileSdkVersion [0-9]\+/compileSdkVersion 36/g' android/app/build.gradle || true
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle || true
            sed -i 's/minSdkVersion [0-9]\+/minSdkVersion 23/g' android/app/build.gradle || true
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts || true
            sed -i 's/compileSdk = [0-9]\+/compileSdk = 36/g' android/app/build.gradle.kts || true
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle.kts || true
            sed -i 's/minSdk = [0-9]\+/minSdk = 23/g' android/app/build.gradle.kts || true
          fi
          # Nâng compileSdk cho tất cả thư viện con trong pub cache (như file_picker)
          find /home/runner/.pub-cache -name "build.gradle*" -exec sed -i 's/compileSdkVersion [0-9]\+/compileSdkVersion 36/g' {} + || true
          find /home/runner/.pub-cache -name "build.gradle*" -exec sed -i 's/compileSdk = [0-9]\+/compileSdk = 36/g' {} + || true
          # Bỏ qua task CheckAarMetadata để không bị chặn bởi xung đột metadata phiên bản giữa các plugin
          echo 'subprojects { tasks.configureEach { if (name.contains("AarMetadata", ignoreCase = true)) { enabled = false } } }' >> android/build.gradle.kts || true
          echo 'subprojects { tasks.configureEach { if (name.contains("AarMetadata")) { enabled = false } } }' >> android/build.gradle || true

      # 8. Build file APK Release hoàn chỉnh
      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      # 9. Tải file APK lên GitHub Actions Artifacts để tải về điện thoại ngay lập tức
      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassLock-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
