name: Build Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Cho phép bấm nút "Run workflow" trực tiếp trên GitHub Actions

jobs:
  build:
    name: Build PassLock APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout mã nguồn repo
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Cài đặt Java JDK 17
      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Cài đặt Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Tự động khởi tạo môi trường Android nếu repo chỉ có lib/main.dart
      - name: Initialize Android Project
        run: |
          if [ ! -d "android" ]; then
            echo "⚡ Khởi tạo cấu trúc Android..."
            flutter create . --platforms=android --org=com.example
          fi

      # 5. Cài đặt các thư viện phụ thuộc (bao gồm file_picker: ^8.1.7)
      - name: Install dependencies
        run: |
          flutter pub add flutter_secure_storage:^9.2.2 share_plus:^10.1.2 path_provider:^2.1.5 cupertino_icons:^1.0.8 uuid:^4.4.0 file_picker:^8.1.7 || true
          flutter pub get

      # 6. Cấp quyền thực thi cho gradlew
      - name: Grant execute permission for gradlew
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      # 7. Khắc phục triệt để compileSdk 36 & vô hiệu hóa hoàn toàn checkAarMetadata cho plugins
      - name: Fix compileSdk 36 & Bypass AarMetadata
        run: |
          mkdir -p android
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

          # A. Tạo init script trong ~/.gradle/init.d/ để tắt mọi AarMetadata task trong Gradle
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/bypass-aar.gradle
          gradle.taskGraph.whenReady { taskGraph ->
              taskGraph.allTasks.each { task ->
                  if (task.name.toLowerCase().contains("aarmetadata")) {
                      task.enabled = false
                  }
              }
          }
          allprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      try { project.android.compileSdkVersion 36 } catch (Exception e) {}
                      try { project.android.compileSdk = 36 } catch (Exception e) {}
                  }
              }
          }
          EOF

          # B. Quét và nâng compileSdk 36 trực tiếp trong cache plugin (file_picker, share_plus...)
          find "$HOME/.pub-cache" /home/runner/.pub-cache /root/.pub-cache -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) 2>/dev/null | while read -r f; do
            sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/g' "$f" || true
            sed -i -E 's/compileSdk[[:space:]]+[0-9]+/compileSdk 36/g' "$f" || true
            sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/g' "$f" || true
            sed -i -E 's/compileSdkVersion[[:space:]]+flutter\.compileSdkVersion/compileSdkVersion 36/g' "$f" || true
            sed -i -E 's/compileSdk[[:space:]]+flutter\.compileSdkVersion/compileSdk 36/g' "$f" || true
            sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*flutter\.compileSdkVersion/compileSdk = 36/g' "$f" || true
          done

          # C. Cấu hình compileSdk 36 trong android/app/build.gradle & build.gradle.kts
          if [ -f "android/app/build.gradle" ]; then
            sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/g' android/app/build.gradle || true
            sed -i -E 's/compileSdkVersion[[:space:]]+flutter\.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle || true
            sed -i -E 's/compileSdk[[:space:]]+[0-9]+/compileSdk 36/g' android/app/build.gradle || true
            sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/g' android/app/build.gradle || true
            sed -i -E 's/minSdkVersion[[:space:]]+[0-9]+/minSdkVersion 23/g' android/app/build.gradle || true
            sed -i -E 's/minSdkVersion[[:space:]]+flutter\.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle || true
          fi

          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i -E 's/compileSdk[[:space:]]*=.*/compileSdk = 36/g' android/app/build.gradle.kts || true
            sed -i -E 's/minSdk[[:space:]]*=.*/minSdk = 23/g' android/app/build.gradle.kts || true
          fi

          # D. Chèn cấu hình bypass AarMetadata vào android/build.gradle nếu có
          if [ -f "android/build.gradle" ]; then
            cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      try { project.android.compileSdkVersion 36 } catch (Exception e) {}
                      try { project.android.compileSdk = 36 } catch (Exception e) {}
                  }
              }
          }
          gradle.taskGraph.whenReady { taskGraph ->
              taskGraph.allTasks.each { task ->
                  if (task.name.toLowerCase().contains("aarmetadata")) {
                      task.enabled = false
                  }
              }
          }
          EOF
          fi

      # 8. Build file APK Release hoàn chỉnh
      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      # 9. Tải file APK lên GitHub Actions Artifacts để tải về điện thoại ngay lập tức
      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassLock-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error